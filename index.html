<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đỗ Hoàng Tấn — Personal Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f9fafb;
      --text:#111827;
      --muted:#6b7280;
      --card:#ffffff;
      --shadow:0 1px 3px rgba(0,0,0,0.10);
      --radius:14px;
    }

    body{
      margin:0;
      padding:0;
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
    }

    header{
      text-align:center;
      margin-top:3.5rem;
      margin-bottom:1.5rem;
      padding:0 1rem;
    }
    header h1{
      margin:0 0 0.35rem;
      font-size:2rem;
      font-weight:600;
      letter-spacing:-0.02em;
    }
    header p{
      margin:0;
      color:var(--muted);
      font-size:0.95rem;
    }

    /* ==== NEW LAYOUT ==== */
    .wrap{
      width:92%;
      max-width:900px;
      margin: 1.25rem 0 2.5rem;
      display:grid;
      grid-template-columns: 320px 1fr;
      gap: 1.25rem;
      align-items:start;
    }

    .panel{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:1.25rem;
    }

    .panel h2{
      margin:0 0 0.9rem;
      font-size:0.95rem;
      font-weight:600;
      color:#374151;
      letter-spacing:0.02em;
      text-transform:uppercase;
    }

    .project-list{
      display:flex;
      flex-direction:column;
      gap:0.75rem;
    }

    .project-item a{
      display:block;
      text-decoration:none;
      color:var(--text);
      font-weight:600;
      background:#f3f4f6;
      border:1px solid #e5e7eb;
      padding:0.9rem 1rem;
      border-radius:12px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .project-item a:hover{
      transform: translateY(-2px);
      background:#eef2f7;
    }
    .project-sub{
      display:block;
      margin-top:0.3rem;
      color:var(--muted);
      font-weight:400;
      font-size:0.85rem;
      word-break:break-word;
    }

    .links{
      display:grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 0.9rem;
    }

    .link-item{
      background:var(--card);
      padding:1rem 1.25rem;
      border-radius:12px;
      text-align:center;
      box-shadow:var(--shadow);
      transition:transform 0.15s ease;
      border:1px solid #eef0f3;
    }
    .link-item:hover{ transform: translateY(-2px); }

    .link-item a{
      text-decoration:none;
      color:#1f2937;
      font-weight:600;
      display:block;
    }

    footer{
      margin-top:auto;
      margin-bottom:2rem;
      font-size:0.875rem;
      color:var(--muted);
    }

    /* Responsive: stack */
    @media (max-width: 820px){
      .wrap{
        grid-template-columns: 1fr;
      }
      .links{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Đỗ Hoàng Tấn</h1>
    <p>Dự án cá nhân</p>
  </header>

  <main class="wrap">
    <!-- LEFT: Projects -->
    <section class="panel">
      <h2>Dự án cá nhân</h2>
      <div class="project-list">
        <div class="project-item">
          <a href="https://dhtan.name.vn/" target="_blank" rel="noopener">
            dhtan.name.vn
            <span class="project-sub">Trang cá nhân / hub</span>
          </a>
        </div>

        <div class="project-item">
          <a href="https://tdesign.ai.vn/" target="_blank" rel="noopener">
            tdesign.ai.vn
            <span class="project-sub">Studio tools / nhánh phụ</span>
          </a>
        </div>
      </div>
    </section>

    <!-- RIGHT: Social links -->
    <section>
      <div class="links">
        <div class="link-item"><a href="https://linkedin.com/in/dohoangtan-nt" target="_blank" rel="noopener">LinkedIn</a></div>
        <div class="link-item"><a href="https://x.com/DoHoangTanX" target="_blank" rel="noopener">X (Twitter)</a></div>
        <div class="link-item"><a href="https://facebook.com/hoangtan.a1" target="_blank" rel="noopener">Facebook Page</a></div>
        <div class="link-item"><a href="https://discord.gg/YourInviteLink" target="_blank" rel="noopener">Discord</a></div>
        <div class="link-item"><a href="mailto:hello@dohoangtan.com" target="_blank" rel="noopener">Email</a></div>

        <!-- Behance để lại cho bạn tự bật/tắt -->
        <div class="link-item"><a href="https://behance.net/dohoangtan" target="_blank" rel="noopener">Behance</a></div>
      </div>
    </section>
  </main>

  <footer>© 2025 Đỗ Hoàng Tấn. All rights reserved.</footer>
</body>
</html>
